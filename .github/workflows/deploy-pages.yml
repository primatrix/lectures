name: Deploy architecture slides

on:
  push:
    branches:
      - main
      # Keep the current review branch deployable until PR #4 is merged.
      - dev/architecture-lecture-next
    paths:
      - 'kimi&glm/architecture/glm5.2-visualization/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload slides
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'kimi&glm/architecture/glm5.2-visualization'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
