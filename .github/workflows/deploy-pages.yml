name: Deploy lecture site

on:
  push:
    branches:
      - main
      - dev/github-pages-preview
    paths:
      - 'site/**'
      - 'kimi&glm/architecture/glm5.2-visualization/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p '_site/kimi-glm/architecture'
          cp 'site/index.html' '_site/index.html'
          cp -R 'kimi&glm/architecture/glm5.2-visualization/.' '_site/kimi-glm/architecture/'

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
